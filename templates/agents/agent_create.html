{% extends "blog/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
    <div class="content-section">
        <h2>Créer un nouvel agent</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="btn btn-primary mt-3" type="submit">Créer</button>
        </form>
    </div>
{% endblock %}
