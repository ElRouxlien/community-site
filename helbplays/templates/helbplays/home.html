{% extends "blog/base.html" %}

{% block content %}

<h2>Chat collaboratif B2</h2>

<h4>Image en direct :</h4>
<img src="{{ image_url }}" style="max-width: 100%; border: 1px solid #333;">

<h4 class="mt-4">Chat en direct :</h4>
<div style="border:1px solid #ccc; padding:1rem; height:300px; overflow-y:auto;">
    {% for line in chat %}
        <p>{{ line }}</p>
    {% endfor %}
</div>

<form method="POST">
    {% csrf_token %}
    <textarea name="message" class="form-control" placeholder="Votre message..."></textarea>
    <button class="btn btn-primary mt-2">Envoyer</button>
</form>

{% endblock %}
