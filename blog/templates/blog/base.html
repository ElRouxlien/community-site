{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">

    <link rel="stylesheet" href="{% static 'blog/main.css' %}">

    <title>HELB Agents</title>
</head>

<body>

<header class="site-header">
    <nav class="navbar navbar-expand-md navbar-dark bg-steel fixed-top">
        <div class="container">

            <a class="navbar-brand" href="{% url 'agent-list' %}">
                HELB Agents
            </a>

            <button class="navbar-toggler" type="button"
                    data-toggle="collapse"
                    data-target="#navbarToggle">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarToggle">

                <div class="navbar-nav mr-auto">
                    <a class="nav-item nav-link" href="{% url 'agent-list' %}">
                        Agents
                    </a>

                    {% if user.is_authenticated %}
                        <a class="nav-item nav-link" href="{% url 'agent-create' %}">
                            Créer un agent
                        </a>

                        <a class="nav-item nav-link" href="{% url 'my-agents' %}">
                            Mes agents
                        </a>

                        <a class="nav-item nav-link" href="/helbplays/">
                            HELBPlays
                        </a>
                    {% endif %}
                </div>

                <div class="navbar-nav">
                    {% if user.is_authenticated %}
                        <a class="nav-item nav-link" href="{% url 'profile' %}">
                            Profil
                        </a>
                        <a class="nav-item nav-link" href="{% url 'logout' %}">
                            Logout
                        </a>
                    {% else %}
                        <a class="nav-item nav-link" href="{% url 'login' %}">
                            Login
                        </a>
                        <a class="nav-item nav-link" href="{% url 'register' %}">
                            Register
                        </a>
                    {% endif %}
                </div>

            </div>
        </div>
    </nav>
</header>

<main role="main" class="container" style="margin-top: 80px;">
    <div class="row">
        <div class="col-md-12">

            

            {% block content %}{% endblock %}

        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

</body>
</html>
